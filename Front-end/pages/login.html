<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="../styles/index.css">
    <title>Login</title>
</head>
<body>
     <nav>
    <div class="logo">
  
    <span ><strong class="name">Kizola</strong> <br> <small>DOAR · TRANSFORMAR</small></span>
  
    </div> 

    <div class="button-nav">
        <button class="login">Login</button>
        <button class="cadastro">Cadastrar</button>
    </div>
    </nav>

    <section class="home">
        <div class="description"></div>
        <div class="card-login">
           <div class="car-login-2">
             <h1>Welcome back</h1>
            <strong class="s-login">New to Kizola? <small class="sl-login">Sign up for free</small></strong>
            <form action="">
                <label for="" id="label-1">Email address</label>
                <input type="email" name="" id="" placeholder="you@gmail.com">
                <label for="" id="label-2">Password</label>
                <input type="password" name="" id="" placeholder="Enter your password">
                <input type="checkbox" name="" id="checkbox" placeholder="remember me">
                <input type="submit" value="sign in">

                <div class="opcoes-login">
                    <button>Google</button>
                    <button>Facebook</button>
                </div>
            </form>
           </div>
        </div>
    </section>


    
</body>
